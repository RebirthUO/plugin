interface:
  display_name: "UO Official Evidence"
  short_description: "Research official UO production behavior"
  default_prompt: "Use $uo-official-evidence to establish the current or historical official Ultima Online behavior for this mechanic."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
  - "openai"
  - "claude"
  - "generic"
  - "vscode"
  activation:
    mode: "implicit"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Use the canonical SKILL.md and classify every source explicitly."
    claude: "Use the neutral Agent Skills source and preserve unresolved evidence gates."
    generic: "Use SKILL.md with no client-specific automation assumed."
    vscode: "Use the Agent Skills source in workspace trust and verify repository revisions."
