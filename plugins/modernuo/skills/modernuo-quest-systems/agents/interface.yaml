interface:
  display_name: ModernUO Quest Systems
  short_description: Quest lifecycle and objective workflows
  default_prompt: Use $modernuo-quest-systems to review, plan, or implement a ModernUO quest lifecycle with current-source evidence and focused verification.
compatibility:
  canonical_format: agent-skills
  adapter_targets: [openai, claude, generic, vscode]
  activation: {mode: implicit, paths: []}
  execution: {context: inline, shell: powershell}
  trust: {source_tier: plugin, remote_inline_execution: forbid, remote_metadata_policy: allow-metadata-only}
  degradation:
    openai: Use the canonical SKILL.md and load references on demand.
    claude: Use the neutral Agent Skills source and preserve explicit safety gates.
    generic: Use SKILL.md with relative references; no client-specific automation is assumed.
    vscode: Use the Agent Skills source in workspace trust and confirm mutations explicitly.
