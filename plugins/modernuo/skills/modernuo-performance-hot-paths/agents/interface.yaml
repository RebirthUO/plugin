interface:
  display_name: ModernUO Performance Hot Paths
  short_description: ModernUO Performance Hot Paths
  default_prompt: Use $modernuo-performance-hot-paths to apply ModernUO Performance Hot Paths guidance to this Ultima Online, ModernUO, or RebirthUO task and verify the result.
compatibility:
  canonical_format: agent-skills
  adapter_targets:
  - openai
  - claude
  - generic
  - vscode
  activation:
    mode: implicit
    paths: []
  execution:
    context: inline
    shell: powershell
  trust:
    source_tier: plugin
    remote_inline_execution: forbid
    remote_metadata_policy: allow-metadata-only
  degradation:
    openai: Use the canonical SKILL.md and load references on demand.
    claude: Use the neutral Agent Skills source and preserve explicit safety gates.
    generic: Use SKILL.md with relative references; no client-specific automation is assumed.
    vscode: Use the Agent Skills source in workspace trust and confirm mutations explicitly.
