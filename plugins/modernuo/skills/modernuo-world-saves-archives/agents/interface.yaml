interface:
  display_name: ModernUO World Saves
  short_description: Audit and change ModernUO save lifecycle and recovery
  default_prompt: Use $modernuo-world-saves-archives to inspect this repository's ModernUO world-save lifecycle, resolve recovery decisions, and verify the result.
compatibility:
  canonical_format: agent-skills
  adapter_targets:
  - openai
  - claude
  - generic
  - vscode
  activation:
    mode: implicit
    paths: []
  execution:
    context: inline
    shell: powershell
  trust:
    source_tier: plugin
    remote_inline_execution: forbid
    remote_metadata_policy: allow-metadata-only
  degradation:
    openai: Use the canonical SKILL.md and load the lifecycle reference only when needed.
    claude: Use the neutral Agent Skills source and preserve evidence and data-safety gates.
    generic: Use SKILL.md with relative references; no client-specific automation is assumed.
    vscode: Use the Agent Skills source in workspace trust and confirm mutations explicitly.
